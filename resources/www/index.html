<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Artly</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #f5d22c;
        color: #111;
      }
      main {
        box-sizing: border-box;
        min-height: 100dvh;
        display: grid;

      }

        margin: 0;
        max-width: 28rem;
        line-height: 1.6;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Artly</h1>
        <p>
          公開URLがまだ設定されていません。<code>src/native/live-url.ts</code>
          に Publish で出た https アドレスを書いてから、もう一度
          <code>npx cap sync</code> してください。
        </p>
      </div>
    </main>
  </body>
</html>
